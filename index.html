<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMR AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #131314;
      color: #e3e3e3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px 20px;
      background-color: #1e1f20;
      border-bottom: 1px solid #2d2f31;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 18px; color: #a8c7fa; }
    select {
      background: #282a2c;
      color: #fff;
      border: 1px solid #3c4043;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .user-msg {
      align-self: flex-end;
      background-color: #282a2c;
      color: #fff;
      border-bottom-left-radius: 4px;
    }
    .ai-msg {
      align-self: flex-start;
      background-color: #1e1f20;
      color: #e3e3e3;
      border: 1px solid #2d2f31;
      border-bottom-right-radius: 4px;
    }
    .input-container {
      padding: 16px;
      background-color: #131314;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background-color: #1e1f20;
      border: 1px solid #3c4043;
      border-radius: 20px;
      color: #fff;
      padding: 12px 18px;
      resize: none;
      font-size: 15px;
      outline: none;
    }
    textarea:focus { border-color: #a8c7fa; }
    button {
      background-color: #a8c7fa;
      color: #040c17;
      border: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>✨ AMR AI Chat</h1>
    <select id="model-select">
      <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
      <option value="gpt-4o-mini">GPT-4o Mini</option>
      <option value="meta-llama/Llama-3.3-70B-Instruct-Turbo">Llama 3.3 70B</option>
    </select>
  </header>

  <div id="chat-box"></div>

  <div class="input-container">
    <textarea id="prompt-input" rows="1" placeholder="اسأل أي شيء..."></textarea>
    <button id="send-btn">↑</button>
  </div>

  <script>
    const WORKER_URL = "https://amr.doctoramr54.workers.dev/";

    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const modelSelect = document.getElementById('model-select');

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    // جلب الـ Token من المتصفح مباشرة للالتفاف على حجب الخوادم
    async function fetchToken() {
      try {
        const res = await fetch("https://duckduckgo.com/duckchat/v1/status", {
          headers: { "x-vnc-req": "1" }
        });
        return res.headers.get("x-vnc-etag");
      } catch (e) {
        return null;
      }
    }

    async function sendMessage() {
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage('user', prompt);
      input.value = '';

      const loadingMsg = appendMessage('ai', 'جاري التفكير...');

      // الحصول على الـ Token محلياً
      const token = await fetchToken();

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            model: modelSelect.value,
            token: token
          })
        });

        const data = await response.json();

        if (data.response) {
          loadingMsg.textContent = data.response;
        } else {
          loadingMsg.textContent = "❌ حدث خطأ: " + (data.error || "فشل الحصول على إجابة");
        }
      } catch (err) {
        loadingMsg.textContent = "❌ تعذر الاتصال بالسيرفر.";
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
